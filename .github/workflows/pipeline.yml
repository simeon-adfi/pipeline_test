name: Create RPM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build_tar:
    name: Create Executable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Compile code
        run: make
      - name: Create tarball
        run: tar -czvf hello-1.0-1.x86_64.tar.gz hello
      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-tarball
          path: hello-1.0-1.x86_64.tar.gz
  build_rpm:
    name: build rpm package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install RPM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Compile code
        run: make
      - name: Run rpmbuild to produce rpm
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp hello ~/rpmbuild/SOURCES/
          cp hello.spec ~/rpmbuild/SPECS/
          rpmbuild -bb --define "_topdir $HOME/rpmbuild" ~/rpmbuild/SPECS/hello.spec
          cp ~/rpmbuild/RPMS/*/*.rpm .

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-1.0-1.rpm
          path: hello-1.0-1.rpm

  release:
    name: Push binary & rpm to releases
    needs:
      - build_tar
      - build_rpm
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
      - name: Push rpm & binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest release-files/*.tar.gz release-files/*.rpm \
            --title "Latest Build" \
            --notes "Automated rolling release from latest commit"
