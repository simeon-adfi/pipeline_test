name: Create RPM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_exe:
    name: Create Executable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: make
        run: make
      - name: test binary
        run: ./hello
      
      - uses: actions/upload-artifact@v4
        with:
          name: hello
          path: hello
  build_rpm:
    name: build rpm package
    needs: build_exe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install RPM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Compile code
        run: make
      - name: Run rpmbuild to produce rpm
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp hello ~/rpmbuild/SOURCES/
          cp hello.spec ~/rpmbuild/SPECS/
          rpmbuild -bb --define "_topdir $HOME/rpmbuild" ~/rpmbuild/SPECS/hello.spec
          cp ~/rpmbuild/RPMS/*/*.rpm .

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-1.0-1.rpm
          path: "*.rpm"

      - name: Push binary & rpm to releases
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
           gh release create "${{ github.ref_name }}" *.rpm \
             --title "Release ${{ github.ref_name }}" \
             --notes "Automated RPM package build for ${{ github.ref_name }}."
