name: Publish RPM

on:
  workflow_run:
    workflows:
      - Create RPM
    branches: [main]
    types:
      - completed

env:
  GITHUB_TOKEN: ${{ secrets.TOKEN }}

jobs:
  release:
    name: Push binary & rpm to releases
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push rpm & binary
        run: | 
          gh release delete latest --yes --repo "${{ github.repository }}" || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/latest" || true
          gh release create latest release-files/RPMS/RPMS/x86_64/*.rpm \
            --repo "${{ github.repository }}" \
            --title "Latest Build" \
            --notes "Rolling release automatically updated on push to main (${{ github.sha }})."
