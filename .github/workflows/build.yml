name: Create RPM

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  build:
    name: Build RPM package from source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install RPM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rpm elfutils file gnupg

      - name: Prep environment
        run: |
          mkdir -p hello-1.0 SOURCES SPECS
          cp Makefile hello.c hello-1.0/
          tar cvfz SOURCES/hello-1.0.tar.gz hello-1.0
          cp hello.spec SPECS/

      - name: Build RPM
        run: rpmbuild -ba --clean --define "_topdir ${PWD}" SPECS/hello.spec

      - name: Sign RPM
        env:
          GPG: ${{ secrets.GPG }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG" | gpg --batch --no-tty --import

          KEY_FINGERPRINT=$(gpg --list-secret-keys --with-colons | grep '^fpr:' | head -n1 | cut -d: -f10)
          
          gpg --armor --export "$KEY_FINGERPRINT" > RPM-GPG-KEY-test
          rpm --import RPM-GPG-KEY-test

          touch /tmp/gpg_passphrase
          if [ -n "$GPG_PASSPHRASE" ]; then
            echo -n "$GPG_PASSPHRASE" > /tmp/gpg_passphrase
          fi

          mkdir -p ~/.config/rpm
          cat << EOF > ~/.config/rpm/macros
          %_signature gpg
          %_gpg_path ~/.gnupg
          %_gpgbin /usr/bin/gpg
          %_gpg_name $KEY_FINGERPRINT
          %_openpgp_sign_id $KEY_FINGERPRINT
          %__gpg_sign_cmd %{_gpgbin} --batch --no-tty --pinentry-mode loopback --passphrase-file /tmp/gpg_passphrase --no-verbose --no-armor -s -b -o %{__signature_filename} %{__plaintext_filename}
          EOF

          cp ~/.config/rpm/macros ~/.rpmmacros

          rpmsign --addsign RPMS/x86_64/hello-1.0-1.x86_64.rpm

          rm -f /tmp/gpg_passphrase

      - name: Verify Signed RPM Metadata
        run: |
          rpm -Kv RPMS/x86_64/hello-1.0-1.x86_64.rpm

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-1.0-1.x86_64.rpm
          path: RPMS/x86_64/hello-1.0-1.x86_64.rpm
