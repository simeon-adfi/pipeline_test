name: Build Packages

on:
  - pull_request
  - push

env:
  package_name: hello
  version: "1.0"

jobs:
  build-el8:
    name: Build EL8 RPMs
    runs-on: ubuntu-latest
    container: ghcr.io/beatrubi/build-el8/build-el8:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prep environment
        run: |
          mkdir -p $package_name-$version SOURCES SPECS
          cp Makefile $package_name.c $package_name-$version/
          tar cvfz SOURCES/$package_name-$version.tar.gz $package_name-$version
          cp $package_name.spec SPECS/

      - name: Build RPM
        run: |
          sudo dnf builddep SPECS/$package_name.spec
          rpmbuild -ba --clean --define "_topdir ${PWD}" SPECS/$package_name.spec

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: EL8
          path: |
            RPMS/*/*.rpm
            SRPMS/*.rpm

