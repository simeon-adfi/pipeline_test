name: Create RPM

on:
  - pull_request
  - push

jobs:
  build:
    name: Build RPM package from source
    runs-on: ubuntu-latest
    container: ghcr.io/beatrubi/build-el9/build-el9:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prep environment
        run: |
          mkdir -p hello-1.0 SOURCES SPECS
          cp Makefile hello.c hello-1.0/
          tar cvfz SOURCES/hello-1.0.tar.gz hello-1.0
          cp hello.spec SPECS/

      - name: Build RPM
        run: |
          sudo dnf builddep SPECS/hello.spec
          rpmbuild -ba --clean --define "_topdir ${PWD}" SPECS/hello.spec

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: RPMS
          path: |
            RPMS/*/*.rpm
            SRPMS/*.rpm
